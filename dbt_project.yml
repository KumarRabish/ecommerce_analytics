name: ecommerce_analytics
version: '1.0.0'
profile: ecommerce_analytics
config-version: 2

model-paths: ['models']
seed-paths: ['seeds']
snapshot-paths: ['snapshots']
test-paths: ['tests']
macro-paths: ['macros']

vars:
  lookback_hours: 72            # re-read this much history on every incremental run
  fiscal_year_start_month: 4    # fiscal year starts 1 April
  start_date: '2023-01-01'      # first day in dim_date

models:
  ecommerce_analytics:
    +on_schema_change: append_new_columns
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
    semantic:
      +materialized: view
      +schema: semantic

seeds:
  ecommerce_analytics:
    +schema: seeds

# store failing rows of every test in <schema>_dbt_test__audit for triage
data_tests:
  +store_failures: true
  +severity: error
