unit_tests:
  - name: fct_order_items_incremental_picks_up_changed_rows_only
    model: fct_order_items
    overrides:
      macros:
        is_incremental: true
      vars:
        lookback_hours: 72
    given:
      - input: ref('int_order_items_enriched')
        rows:
          - {order_item_id: 1, order_id: 10, product_id: 5, quantity: 2, net_amount_usd: 20, is_deleted: false, last_changed_at: '2026-03-01 00:00:00'}   # old: outside the window
          - {order_item_id: 2, order_id: 10, product_id: 5, quantity: 1, net_amount_usd: 10, is_deleted: false, last_changed_at: '2026-03-10 09:00:00'}   # new
          - {order_item_id: 3, order_id: 11, product_id: 5, quantity: 1, net_amount_usd: 10, is_deleted: true,  last_changed_at: '2026-03-10 10:00:00'}   # deleted upstream
      - input: ref('dim_products')
        rows:
          - {product_key: 5, unit_cost: 3}
      - input: this
        rows:
          - {order_item_id: 1, last_changed_at: '2026-03-09 12:00:00'}
    expect:
      rows:
        - {order_item_id: 2, cogs_usd: 3, is_deleted: false}
        - {order_item_id: 3, cogs_usd: 3, is_deleted: true}    # delete is carried as a flag
