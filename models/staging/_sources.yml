version: 2

sources:
  - name: shop
    database: RAW
    schema: SHOP
    config:
      loaded_at_field: _fivetran_synced
      freshness:
        warn_after:  {count: 6,  period: hour}
        error_after: {count: 24, period: hour}
    tables:
      - name: customers
        columns:
          - name: id
            data_tests: [unique, not_null]
      - name: products
        columns:
          - name: id
            data_tests: [unique, not_null]
      - name: orders
        columns:
          - name: id
            data_tests: [unique, not_null]
          - name: status
            data_tests:
              - accepted_values:
                  arguments:
                    values: ['pending', 'cancelled', 'paid', 'shipped', 'delivered']
                    config: {severity: warn}      # new statuses should alert, not block
      - name: order_items
        columns:
          - name: id
            data_tests: [unique, not_null]
      - name: payments
        columns:
          - name: id
            data_tests: [unique, not_null]
      - name: refunds
        columns:
          - name: id
            data_tests: [unique, not_null]
