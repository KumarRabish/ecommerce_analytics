version: 2

models:
  - name: stg_shop__orders
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests: [not_null]
      - name: order_status
        data_tests:
          - accepted_values:
              arguments:
                values: ['pending', 'cancelled', 'paid', 'shipped', 'delivered']
      - name: currency_code
        data_tests:
          - accepted_values:
              arguments:
                values: ['USD', 'EUR', 'INR', 'GBP']
                config: {severity: warn}
  - name: stg_shop__order_items
    columns:
      - name: order_item_id
        data_tests: [unique, not_null]
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_shop__orders')
                field: order_id
                config: {severity: warn}   # items can land before their order (see bug A8)
  - name: stg_shop__customers
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
  - name: stg_shop__products
    columns:
      - name: product_id
        data_tests: [unique, not_null]
  - name: stg_shop__payments
    columns:
      - name: payment_id
        data_tests: [unique, not_null]
  - name: stg_shop__refunds
    columns:
      - name: refund_id
        data_tests: [unique, not_null]
